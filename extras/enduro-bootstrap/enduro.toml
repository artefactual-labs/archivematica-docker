# This is the configuration file valid for the development environment.

verbosity = 2
debug = true
debugListen = "127.0.0.1:9001"

[telemetry.traces]
enabled = false
address = "127.0.0.1:12345"
ratio = 1.0

[temporal]
namespace = "default"
address = "temporal:7233"
taskQueue = "global"

[batch]
browserRoot = "/home/"

[api]
listen = "0.0.0.0:9000"
legacyListen = "127.0.0.1:9002"
debug = false

[database]
dsn = "archivematica:demo@tcp(mysql:3306)/enduro"

[extractActivity]
dirMode = "0o700"
fileMode = "0o600"

[objectEventWebhook]
enabled = true
listen = "0.0.0.0:7480"
redisAddress = "redis://redis:6379"
redisList = "object-events"
bucketsPath = "/buckets"

[[watcher.s3]]
name = "dev-s3"
eventSource = "redis"
eventFormat = "enduro"
redisAddress = "redis://redis:6379"
redisList = "object-events"
endpoint = "http://127.0.0.1:6379"
pathStyle = true
key = "minio"
secret = "minio123"
region = "us-west-1"
bucket = "sips"
pipeline = "am"
retentionPeriod = "10s"
stripTopLevelDir = true
rejectDuplicates = false
excludeHiddenFiles = false
transferType = "standard"

[[watcher.filesystem]]
name = "dev-fs"
path = "/home/enduro"
inotify = false
pipeline = "am"
completedDir = "./hack/landfill"
ignore = '(^\.gitkeep)|(^*\.mft)$'
stripTopLevelDir = false
rejectDuplicates = false
excludeHiddenFiles = false
transferType = "standard"

[[pipeline]]
name = "am"
baseURL = "http://archivematica-dashboard:8000"
user = "test"
key = "test"
transferDir = "/home/"
processingDir = ""
processingConfig = "automated"
# transferLocationID = "88f6b517-c0cc-411b-8abf-79544ce96f54"
#transferLocationID = "aa5d7883-4b8d-4117-9121-16a9a9e5b7fb"
storageServiceURL = "http://test:test@127.0.0.1:62081"
capacity = 3
retryDeadline = "10m"
transferDeadline = "24h"
unbag = false

[pipeline.recovery]
reconcileExistingAIP = true

[validation]
checksumsCheckEnabled = false

[[hooks."hari"]]
baseURL = ""    # E.g.: "https://192.168.1.50:8080/api"
mock = true
disabled = true

[[hooks."prod"]]
receiptPath = "./hack/production-system-interface"
disabled = true

[metadata]
processNameMetadata = false

[worker]
heartbeatThrottleInterval = "1m"
maxConcurrentWorkflowsExecutionsSize = 15
maxConcurrentSessionExecutionSize = 15

[workflow]
activityHeartbeatTimeout = "30s"
