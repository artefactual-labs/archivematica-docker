services:
  mysql-enduro-db:
    image: "percona/percona-server:8.4.10-10"
    platform: "linux/amd64"
    command: "--character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci"
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_USER: "archivematica"
      MYSQL_PASSWORD: "demo"
    volumes:
      - "./.etc/mysql/tuning.cnf:/etc/my.cnf.d/tuning.cnf:ro"
      - "mysql_data:/var/lib/mysql"
      - "./.archivematica-init/:/docker-entrypoint-initdb.d/:ro"
    cap_add:
      - "SYS_NICE"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mysql -uroot -p12345 -e "CREATE DATABASE IF NOT EXISTS enduro;
                            CREATE DATABASE IF NOT EXISTS temporal;
                            CREATE DATABASE IF NOT EXISTS temporal_visibility;
                            GRANT ALL PRIVILEGES ON enduro.* TO 'archivematica'@'%';
                            GRANT ALL PRIVILEGES ON temporal.* TO 'archivematica'@'%';
                         GRANT ALL PRIVILEGES ON temporal_visibility.* TO 'archivematica'@'%';"
    depends_on:
      archivematica-dashboard:
        condition: service_healthy



  temporal-admin-tools:
    image: "temporalio/admin-tools:1.30.5"
    restart: "on-failure:6"
    depends_on:
      mysql:
        condition: service_healthy
      mysql-enduro-db:
        condition: service_completed_successfully
    environment:
      - "DB=enduro"
      - "DB_PORT=3306"
      - "MYSQL_USER=archivematica"
      - "MYSQL_PWD=demo"
      - "MYSQL_SEEDS=mysql"
      - "SQL_PASSWORD=demo"
    volumes:
      - ".enduro-init/:/compose"
    entrypoint: ["/bin/sh"]
    command: "/compose/setup-mysql.sh"


  temporal:
    image: "temporalio/server:1.30.5"
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - "DB=mysql8"
      - "DB_PORT=3306"
      - "MYSQL_USER=archivematica"
      - "MYSQL_PWD=demo"
      - "MYSQL_SEEDS=mysql"
      - "SQL_USER=archivematica"
      - "SQL_PASSWORD=demo"
      - "BIND_ON_IP=0.0.0.0"
      - "DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml"
    volumes:
      - ".enduro-init/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig"
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60



  temporal-create-namespace:
    image: "temporalio/admin-tools:1.30.5"
    restart: "on-failure:5"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - "TEMPORAL_ADDRESS=temporal:7233"
      - "DEFAULT_NAMESPACE=default"
    volumes:
      - ".enduro-init/:/compose"
    entrypoint: ["/bin/sh"]
    command: "/compose/create-namespace.sh"

  temporal-ui:
    image: "temporalio/ui:2.51.1"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - "TEMPORAL_ADDRESS=temporal:7233"
      - "TEMPORAL_CORS_ORIGINS=http://localhost:7440"
    ports:
      - "127.0.0.1:7440:8080"

  enduro:
    image: "alpine:3.10"
    depends_on:
      temporal:
        condition: service_healthy
      archivematica-dashboard:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - "TEMPORAL_ADDRESS=temporal:7233"
        #- "TEMPORAL_CORS_ORIGINS=http://localhost:7440"
    volumes:
      - ".enduro-init/enduro.toml:/etc/enduro.toml:ro"
      - "${ARCHIVEMATICA_SS_TRANSFER_SOURCE:-./}:/home:rw"
    ports:
      - "127.0.0.1:9000:9000"
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk --update add openssl wget unzip && rm -rf /var/cache/apk/*
        wget -q https://github.com/artefactual-labs/enduro/releases/download/v0.46.1/enduro_0.46.1_Linux-64bit.tar.gz
        tar zxvf enduro_0.46.1_Linux-64bit.tar.gz
        enduro_0.46.1_Linux-64bit/enduro --config /etc/enduro.toml

  seaweedfs:
    image: "chrislusf/seaweedfs:4.31"
    command: "mini -dir=/data -ip.bind=0.0.0.0 -bucket=sips -master.volumeSizeLimitMB=64 -webdav=false -admin.ui=true -s3.port.iceberg=0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AWS_ACCESS_KEY_ID: "minio"
      AWS_SECRET_ACCESS_KEY: "minio123"
      S3_BUCKET: "sips"
    volumes:
      - "./hack/seaweedfs-data:/data"
      - "./hack/seaweedfs/notification.toml:/etc/seaweedfs/notification.toml:ro"
    ports:
      - "127.0.0.1:7460:8333"
      - "127.0.0.1:7461:8888"
      - "127.0.0.1:23646:23646"

  redis:
    # Redis 8.2 is the current Redis 8 LTS line. Redis policy marks the
    # second and last minor releases in a major version as LTS; newer interim
    # minors, such as 8.4, are STS.
    image: "redis:8.2.6-alpine3.22"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    ports:
      - "127.0.0.1:6379:7470"
