
volumes:
  rabbitmq_data:
  rabbitmq_logs:
  typesense_data:
  aipscan_data:
    driver: local
    driver_opts:
      type: none
      device: ${AIPSCAN_DOWNLOADS:-.aipscan}
      o: bind


services:
  mysql-aipscan-db:
    image: "percona/percona-server:8.0.43-34"
    platform: "linux/amd64"
    command: "--character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci"
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_USER: "archivematica"
      MYSQL_PASSWORD: "demo"
    volumes:
      - "./.etc/mysql/tuning.cnf:/etc/my.cnf.d/tuning.cnf:ro"
      - "mysql_data:/var/lib/mysql"
      - "./.init-scripts/:/docker-entrypoint-initdb.d/:ro"
    cap_add:
      - "SYS_NICE"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mysql -uroot -p12345 -e "create database if not exists aipscan; 
             create database if not exists celery;
             GRANT ALL ON aipscan.* TO 'archivematica'@'%';
             GRANT ALL ON celery.* TO 'archivematica'@'%';"
    depends_on:
      archivematica-storage-service:
        condition: service_healthy

  aipscan:
    image: artefactual/aipscan:pre
    platform: "linux/amd64"
    environment: &aipscan-env
      - CELERY_BROKER_URL=amqp://guest@rabbitmq//
      - TYPESENSE_HOST=typesense
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://archivematica:demo@mysql:3306/aipscan
      - SQLALCHEMY_CELERY_BACKEND=mysql+pymysql://archivematica:demo@mysql:3306/aipscan
      - CELERY_RESULT_BACKEND=db+mysql+pymysql://archivematica:demo@mysql:3306/celery
      - TYPESENSE_API_KEY=xyz
      - CREATE_DB=true
      - AGGREGATOR_DOWNLOAD_ROOT=/downloads
      - SECRET_KEY="12345"
    ports:
      - 5001:5001
    command:  gunicorn --preload --timeout 10 --workers 1 --error-logfile - --log-level debug --capture-output --bind 0.0.0.0:5001 "AIPscan:create_app()"
    volumes:
      - "aipscan_data:/downloads/:rw"
    healthcheck:
      test: "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/5001; exit $?;'"
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mysql:
         condition: service_healthy
      aipscan-migrate:
         condition: service_completed_successfully

  aipscan-migrate:
    image: "artefactual/aipscan:pre"
    environment: *aipscan-env
    command: flask db upgrade
    restart: on-failure
    depends_on:
      mysql-aipscan-db:
        condition: service_completed_successfully
  aipscan-ss-configure:
    image: "artefactual/aipscan:pre"
    environment: *aipscan-env
    command: >
      python -m  flask storage-service-bootstrap --name "local"
             --url "http://archivematica-storage-service:8000"
             --username "test"
             --api-key "test"
             --default
    restart: on-failure
    depends_on:
      aipscan-migrate:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:4.1.4-management
    platform: "linux/amd64"
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    depends_on:
      - aipscan
    healthcheck:
       test: rabbitmq-diagnostics -q ping
       interval: 30s
       timeout: 30s
       retries: 3

  aipscan-worker:
    image: artefactual/aipscan:pre
    platform: "linux/amd64"
    environment: *aipscan-env
    command: celery -A AIPscan.worker.celery worker --loglevel=debug
    volumes:
      - "aipscan_data:/downloads/:rw"
    depends_on:
      mysql:
         condition: service_healthy
      rabbitmq:
         condition: service_healthy
      aipscan:
         condition: service_healthy

  typesense:
    image: typesense/typesense:29.0
    platform: "linux/amd64"
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: xyz
    volumes:
      - typesense_data:/data
    ports:
      - 8108:8108
