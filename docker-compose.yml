---

# Basic docker-compose file for running a local instance of Archivematica.

# This file is based on the one at
# https://github.com/artefactual/archivematica/blob/stable/1.18.x/hack/docker-compose.yml

# The name of the project, used to prefix container names and network names.
name: am

configs:
  passwd:
    content: |
      archivematica:x:${UID:-1000}:${UID:-1000}::/var/lib/archivematica/:/bin/bash
  group:
    content: |
      archivematica:x:${UID:-1000}:x

volumes:

  # Internal named volumes.
  # These are not accessible outside of the docker host and are maintained by
  # Docker.
  mysql_data:
    name: "${COMPOSE_PROJECT_NAME}_mysql_data"
  elasticsearch_data:
    name: "${COMPOSE_PROJECT_NAME}_elasticsearch_data"
  archivematica_storage_service_staging_data:
    driver: local
    driver_opts:
      type: none
      device: ${ARCHIVEMATICA_SS_STAGING:-./.storage_service}
      o: bind
  archivematica_pipeline_data:
    driver: local
    driver_opts:
      type: none
      device: ${ARCHIVEMATICA_SHAREDDIRECTORY:-./.sharedDirectory}
      o: bind

services:

  mysql:
    restart: unless-stopped
    image: "percona/percona-server:8.4.10-10"
    platform: "linux/amd64"
    command: "--character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci"
    env_file: "environments/mysql.env"
    volumes:
      - "./etc/mysql/tuning.cnf:/etc/my.cnf.d/tuning.cnf:ro"
      - "mysql_data:/var/lib/mysql"
      - "./etc/mysql/init-scripts/:/docker-entrypoint-initdb.d/:ro"
    cap_add:
      - "SYS_NICE"
    healthcheck:
       test: ["CMD-SHELL", "mysqladmin ping --protocol=socket -uroot --silent"]
       interval: 2s
       timeout: 5s
       retries: 30
       start_period: 10s

  elasticsearch:
    profiles: ["search"]
    restart: unless-stopped
    image: "docker.elastic.co/elasticsearch/elasticsearch:8.19.3"
    platform: "linux/amd64"
    environment:
      - "cluster.name=am-cluster"
      - "node.name=am-node"
      - "network.host=0.0.0.0"
      - "bootstrap.memory_lock=true"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "cluster.routing.allocation.disk.threshold_enabled=${ELASTICSEARCH_DISK_THRESHOLD_ENABLED:-true}"
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "xpack.security.transport.ssl.enabled=false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -fsSL http://localhost:9200/_cat/health?h=status | sed -r 's/^[[:space:]]+|[[:space:]]+$//g' | grep -q -E 'green|yellow'",
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    volumes:
      - "elasticsearch_data:/usr/share/elasticsearch/data"

  nginx:
    restart: unless-stopped
    image: "nginx:1.29.1"
    platform: "linux/amd64"
    volumes:
      - "./etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./etc/nginx/conf.d:/etc/nginx/conf.d:ro"
    ports:
      - "${AM_DASHBOARD_PORT:-62080}:80"
      - "${AMSS_PORT:-62081}:8000"
    depends_on:
      archivematica-dashboard:
         condition: service_healthy
      archivematica-storage-service:
         condition: service_healthy

  gearmand:
    restart: unless-stopped
    image: "artefactual/gearmand:1.1.22-alpine"
    command: "--queue-type=builtin"
    user: "gearman"

  clamavd:
    restart: unless-stopped
    image: "clamav/clamav-debian:1.5.3"
    user: "clamav"
    entrypoint: "/init-unprivileged"
    environment:
      CLAMD_CONF_MaxFileSize: "42M"
      CLAMD_CONF_MaxScanSize: "42M"
      CLAMD_CONF_StreamMaxLength: "100M"
    volumes:
      - "archivematica_pipeline_data:/var/archivematica/sharedDirectory:ro"

  # Migrations containers
  # We run them always to ensure migrations in new versions take effect

  archivematica-storage-service-migrations:
    image: "${AMSS_IMAGE:-artefactual/archivematica-storage-service:v0.24.0}"
    platform: "linux/amd64"
    restart: "on-failure:5"
    entrypoint:
       - python3
       - -m
       - archivematica.storage_service.manage
       - migrate
       - --noinput
    env_file: "environments/archivematica-storage-service.env"
    depends_on:
      mysql:
         condition: service_healthy

  archivematica-dashboard-migrations:
    image: "${AM_DASHBOARD_IMAGE:-artefactual/archivematica-dashboard:v1.18.0}"
    restart: "on-failure:5"
    platform: "linux/amd64"
    env_file: "environments/archivematica-dashboard.env"
    entrypoint:
       - python3
       - -m
       - archivematica.dashboard.manage
       - migrate
       - --noinput
    depends_on:
      mysql:
         condition: service_healthy

  # Bootstrap commands
  # Those are only needed the first time the system is registered

  archivematica-storage-service-bootstrap:
    image: "${AMSS_IMAGE:-artefactual/archivematica-storage-service:v0.24.0}"
    platform: "linux/amd64"
    env_file: "environments/archivematica-storage-service.env"
    entrypoint:
       - python3
       - -m
       - archivematica.storage_service.manage
       - create_user
       - --username=${ARCHIVEMATICA_SS_USER:-test}
       - --password=${ARCHIVEMATICA_SS_PASSWORD:-test}
       - --email=${ARCHIVEMATICA_SS_EMAIL:-test}
       - --api-key=${ARCHIVEMATICA_SS_APIKEY:-test}
       - --superuser
    depends_on:
      archivematica-storage-service-migrations:
         condition: service_completed_successfully

  archivematica-dashboard-bootstrap:
    image: "${AM_DASHBOARD_IMAGE:-artefactual/archivematica-dashboard:v1.18.0}"
    platform: "linux/amd64"
    env_file: "environments/archivematica-dashboard.env"
    entrypoint:
       - python3
       - -m
       - archivematica.dashboard.manage
       - install
       - --username=${ARCHIVEMATICA_DASHBOARD_USER:-test}
       - --password=${ARCHIVEMATICA_DASHBOARD_PASSWORD:-test}
       - --email=${ARCHIVEMATICA_DASHBOARD_EMAIL:-test}
       - --org-name=${ARCHIVEMATICA_DASHBOARD_ORG_NAME:-test}
       - --org-id=${ARCHIVEMATICA_DASHBOARD_ORG_ID:-test}
       - --api-key=${ARCHIVEMATICA_DASHBOARD_APIKEY:-test}
       - --ss-url=http://archivematica-storage-service:8000
       - --ss-user=${ARCHIVEMATICA_SS_USER:-test}
       - --ss-api-key=${ARCHIVEMATICA_SS_APIKEY:-test}
       - --site-url=http://archivematica-dashboard:8000
    depends_on:
      archivematica-dashboard-migrations:
         condition: service_completed_successfully
      archivematica-storage-service-bootstrap:
         condition: service_completed_successfully
      archivematica-storage-service:
         condition: service_healthy
      elasticsearch:
         condition: service_healthy
         required: false
      mysql:
         condition: service_healthy

  archivematica-storage-service:
    image: "${AMSS_IMAGE:-artefactual/archivematica-storage-service:v0.24.0}"
    user: "${UID:-1000}:${UID:-1000}"
    platform: "linux/amd64"
    restart: on-failure:5
    env_file: "environments/archivematica-storage-service.env"

    healthcheck:
      test: "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/8000; exit $?;'"
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      mysql:
        condition: service_healthy
      archivematica-storage-service-migrations:
        condition: service_completed_successfully
    configs:
      - source: passwd
        target: /etc/passwd
      - source: group
        target: /etc/group
    volumes:
      - "archivematica_pipeline_data:/var/archivematica/sharedDirectory:rw"
      - "archivematica_storage_service_staging_data:/var/archivematica/storage_service:rw"
      - "./Transfers:/home:rw"
      - "./AIPsStore:/var/archivematica/sharedDirectory/www/AIPsStore"
      - "./DIPsStore:/var/archivematica/sharedDirectory/www/DIPsStore"
      # Other folders can be mounted to be available in the tranfer source:
      # - "~/Downloads:/home/Downloads"

  archivematica-dashboard:
    image: "${AM_DASHBOARD_IMAGE:-artefactual/archivematica-dashboard:v1.18.0}"
    user: "${UID:-1000}:${UID:-1000}"
    platform: "linux/amd64"
    restart: on-failure:5
    env_file: "environments/archivematica-dashboard.env"
    healthcheck:
      test: "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/8000; exit $?;'"
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      elasticsearch:
         condition: service_healthy
         required: false
      mysql:
         condition: service_healthy
    configs:
      - source: passwd
        target: /etc/passwd
      - source: group
        target: /etc/group
    volumes:
      - "archivematica_pipeline_data:/var/archivematica/sharedDirectory:rw"

  archivematica-mcp-server:
    image: "${AM_MCP_SERVER_IMAGE:-artefactual/archivematica-mcp-server:v1.18.0}"
    user: "${UID:-1000}:${UID:-1000}"
    platform: "linux/amd64"
    restart: on-failure:5
    env_file: "environments/archivematica-mcp-server.env"
    healthcheck:
      test: "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/7999; exit $?;'"
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      archivematica-dashboard:
        condition: service_healthy
      archivematica-dashboard-migrations:
        condition: service_completed_successfully
    configs:
      - source: passwd
        target: /etc/passwd
      - source: group
        target: /etc/group
    volumes:
      - "archivematica_pipeline_data:/var/archivematica/sharedDirectory:rw"
      - "./AIPsStore:/var/archivematica/sharedDirectory/www/AIPsStore"
      - "./DIPsStore:/var/archivematica/sharedDirectory/www/DIPsStore"

  archivematica-mcp-client:
    image: "${AM_MCP_CLIENT_IMAGE:-artefactual/archivematica-mcp-client:v1.18.0}"
    user: "${UID:-1000}:${UID:-1000}"
    platform: "linux/amd64"
    restart: on-failure:5
    env_file: "environments/archivematica-mcp-client.env"
    depends_on:
      archivematica-mcp-server:
        condition: service_healthy
    configs:
      - source: passwd
        target: /etc/passwd
      - source: group
        target: /etc/group
    volumes:
      - "archivematica_pipeline_data:/var/archivematica/sharedDirectory:rw"
