---

# Basic docker-compose file for running a local instance of Archivematica.

# This file is based on the one at
# https://github.com/artefactual/archivematica/blob/stable/1.18.x/hack/docker-compose.yml


# The name of the project, used to prefix container names and network names.
name: am2


volumes:

  # Internal named volumes.
  # These are not accessible outside of the docker host and are maintained by
  # Docker.
  clamavd_data:
  mysql_data:

  archivematica_pipeline_data:
    driver: local
    driver_opts:
      type: none
      device: ${ARCHIVEMATICA_SHAREDDIRECTORY:-.sharedDirectory}
      o: bind
  


include:
  - archivematica/bootstrap.yml 

services:

  mysql:
    image: "percona/percona-server:8.4.10-10"
    command: "--character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci"
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_USER: "archivematica"
      MYSQL_PASSWORD: "demo"
    volumes:
      - "./etc/mysql/tuning.cnf:/etc/my.cnf.d/tuning.cnf:ro"
      - "mysql_data:/var/lib/mysql"
    ports:
      - "127.0.0.1:63001:3306"
    cap_add:
      - "SYS_NICE"
    healthcheck:
       test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
       timeout: 10s
       retries: 10


  archivematica-dashboard:
    image: "am-archivematica-dashboard:latest"
    platform: "linux/amd64"
    env_file: "archivematica/dashboard-env"
    healthcheck:
      test: "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/8000; exit $?;'"
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      archivematica-dashboard-bootstrap:
         condition: service_completed_successfully
    volumes:
      - "archivematica_pipeline_data:/var/archivematica/secondSharedDirectory:rw"

    links:
      - "mysql"
      - "gearmand"

  archivematica-mcp-server:
    image: "am-archivematica-mcp-server:latest"
    platform: "linux/amd64"
    env_file: "archivematica/mcp-server-env"
    healthcheck:
      test: "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/7999; exit $?;'"
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s
    depends_on:
      archivematica-dashboard:
        condition: service_healthy
    volumes:
      - "archivematica_pipeline_data:/var/archivematica/secondSharedDirectory:rw"
      - "./AIPsStore:/var/archivematica/sharedDirectory/www/AIPsStore"
      - "./DIPsStore:/var/archivematica/sharedDirectory/www/DIPsStore"
    links:
      - "mysql"
      - "gearmand"

  archivematica-mcp-client:
    image: "am-archivematica-mcp-client:latest"
    platform: "linux/amd64"
    env_file: "archivematica/mcp-client-env"
    depends_on:
      archivematica-mcp-server:
        condition: service_healthy
    volumes:
      - "archivematica_pipeline_data:/var/archivematica/secondSharedDirectory:rw"
    links:
      - "mysql"
      - "gearmand"

  gearmand:
    image: "artefactual/gearmand:1.1.22-alpine"
    command: "--queue-type=builtin"
    user: "gearman"
    ports:
      - "127.0.0.1:63004:4730"

  nginx:
    image: "nginx:1.29.1"
    volumes:
      - "./etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./etc/nginx/conf.d/archivematica.conf:/etc/nginx/conf.d/archivematica.conf:ro"
      - "./etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro"
    ports:
      - "63080:80"
      - "63081:8000"



